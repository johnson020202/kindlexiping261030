<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f3f1eb"><meta name="description" content="百部经典，每日一段。Kindle 锁屏与离线阅读器。"><title>栖息 · 每日名著</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><a class="wordmark" href="./" aria-label="返回今天">栖<span>息</span></a><span class="edition">一百部经典 · 每日一段</span><div class="header-actions"><button id="library" aria-label="打开书架">书架</button><button id="export" aria-label="下载今日锁屏">锁屏图</button></div></header>
<main>
